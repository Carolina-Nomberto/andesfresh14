<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo Externo vía API Fetch | Andes Fresh</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-5">
  <h2 class="text-primary mb-4">Catálogo consumido por JavaScript (API REST)</h2>
  <a class="btn btn-secondary mb-3" href="/inicio">Volver al Portal</a>
  
  <table class="table table-striped table-bordered">
    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Marca</th>
        <th>Categoría</th>
        <th>Precio (S/)</th>
        <th>Cantidad</th>
      </tr>
    </thead>
    <tbody id="tabla-productos">
      <!-- Los datos se llenarán dinámicamente con fetch -->
    </tbody>
  </table>

  <script>
    async function cargarProductos() {
      try {
        const respuesta = await fetch('/api/productos');
        if (!respuesta.ok) {
          throw new Error('Error al obtener los datos de la API');
        }
        const productos = await respuesta.json();
        
        const tbody = document.getElementById('tabla-productos');
        tbody.innerHTML = '';

        productos.forEach(p => {
          const fila = `<tr>
            <td>${p.id}</td>
            <td>${p.nombre}</td>
            <td>${p.marca}</td>
            <td>${p.categoria}</td>
            <td>${p.precio.toFixed(2)}</td>
            <td>${p.cantidad}</td>
          </tr>`;
          tbody.innerHTML += fila;
        });
      } catch (error) {
        console.error('Hubo un problema:', error);
        alert('No se pudo cargar el catálogo desde la API.');
      }
    }

    document.addEventListener('DOMContentLoaded', cargarProductos);
  </script>
</body>
</html>
